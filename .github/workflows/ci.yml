name: CI Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12.7"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install mlflow pandas scikit-learn dagshub matplotlib seaborn

      - name: Train Machine Learning Model (Basic)
        run: |
          cd MLProject
          mlflow run . --env-manager=local --experiment-name="Latihan Breast Cancer - Basic"
          
      - name: Upload MLflow Runs (Skilled)
        uses: actions/upload-artifact@v4
        with:
          name: mlruns-artifact
          path: MLProject/mlruns/
          retention-days: 7
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          
      - name: Build and Push Docker Image (Advanced)
        uses: docker/build-push-action@v5
        with:
          context: "Monitoring dan Logging"
          file: "Monitoring dan Logging/Dockerfile"
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/ml-monitoring:latest

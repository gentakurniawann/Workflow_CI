version: '3.8'

services:
  prometheus:
    image: prom/prometheus:latest
    volumes:
      - ./2.prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
    networks:
      - monitor_net

  grafana:
    image: grafana/grafana:latest
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning
    networks:
      - monitor_net
    depends_on:
      - prometheus

  model_api:
    build: .
    ports:
      - "8000:8000"
    networks:
      - monitor_net

networks:
  monitor_net:
    driver: bridge
